name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsentry
          POSTGRES_PASSWORD: opsentry
          POSTGRES_DB: opsentry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsentry -d opsentry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPSENTRY_POSTGRES_TEST_URL: postgres://opsentry:opsentry@localhost:5432/opsentry?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test -race
        run: go test -race -timeout=5m ./...
      - name: go test -tags integration
        run: go test -tags integration -race -timeout=5m ./internal/storage/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m
