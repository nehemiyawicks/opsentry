chains:
  - id: base
    chain_id: 8453
    rpcs:
      - url: https://mainnet.base.org
        weight: 100
    block_time_ms: 2000
    confirmations:
      fast: 3
      safe: safe
      finalized: finalized
    reorg_check: hash_chain
    recovery:
      enabled: true
      interval: 5m
      max_blocks_per_run: 50
      max_retries: 3

receivers:
  - id: info
    type: log
    url: ""
    template:
      title: "[INFO] Uniswap V3 pool created on ${event.log.chain}"
      body: |
        token0=${event.params.token0}
        token1=${event.params.token1}
        fee=${event.params.fee}
        pool=${event.params.pool}
        tx=${event.log.tx_hash}
        block=${event.log.block.number}

monitors:
  - id: uniswap-v3-factory-base
    chain: base
    address: "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"
    abi: |
      [
        {"anonymous":false,"inputs":[{"indexed":true,"name":"token0","type":"address"},{"indexed":true,"name":"token1","type":"address"},{"indexed":true,"name":"fee","type":"uint24"},{"indexed":false,"name":"tickSpacing","type":"int24"},{"indexed":false,"name":"pool","type":"address"}],"name":"PoolCreated","type":"event"}
      ]
    confirmation: fast
    rules:
      - when: 'event.name == "PoolCreated"'
        severity: info
        receivers: [info]
