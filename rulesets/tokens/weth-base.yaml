chains:
  - id: base
    chain_id: 8453
    rpcs:
      - url: https://mainnet.base.org
        weight: 100
    block_time_ms: 2000
    confirmations:
      fast: 3
      safe: safe
      finalized: finalized
    reorg_check: hash_chain
    recovery:
      enabled: true
      interval: 5m
      max_blocks_per_run: 50
      max_retries: 3

receivers:
  - id: high
    type: log
    url: ""
    throttle:
      min_interval: 5s
    template:
      title: "[HIGH] Large WETH transfer on Base"
      body: |
        value=${event.params.value} (raw, 18 decimals)
        from=${event.params.from}
        to=${event.params.to}
        tx=${event.log.tx_hash}
        block=${event.log.block.number}

monitors:
  - id: weth-large-transfer-base
    chain: base
    address: "0x4200000000000000000000000000000000000006"
    abi: erc20
    confirmation: fast
    rules:
      - when: 'event.name == "Transfer" && event.params.value > 100e18'
        severity: high
        receivers: [high]
