chains:
  - id: base
    chain_id: 8453
    rpcs:
      - url: https://mainnet.base.org
        weight: 100
    block_time_ms: 2000
    confirmations:
      fast: 3
      safe: safe
      finalized: finalized
    reorg_check: hash_chain
    recovery:
      enabled: true
      interval: 5m
      max_blocks_per_run: 50
      max_retries: 3

receivers:
  - id: info
    type: log
    url: ""
    template:
      title: "[INFO] L2CrossDomainMessenger: ${event.name}"
      body: |
        target=${event.params.target}
        sender=${event.params.sender}
        messageNonce=${event.params.messageNonce}
        tx=${event.log.tx_hash}
        block=${event.log.block.number}
  - id: high
    type: log
    url: ""
    template:
      title: "[HIGH] L2->L1 message failed to relay on ${event.log.chain}"
      body: |
        msgHash=${event.params.msgHash}
        tx=${event.log.tx_hash}
        block=${event.log.block.number}

monitors:
  - id: base-l2-cross-domain-messenger
    chain: base
    address: "0x4200000000000000000000000000000000000007"
    abi: |
      [
        {"anonymous":false,"inputs":[{"indexed":true,"name":"target","type":"address"},{"indexed":false,"name":"sender","type":"address"},{"indexed":false,"name":"message","type":"bytes"},{"indexed":false,"name":"messageNonce","type":"uint256"},{"indexed":false,"name":"gasLimit","type":"uint256"}],"name":"SentMessage","type":"event"},
        {"anonymous":false,"inputs":[{"indexed":true,"name":"msgHash","type":"bytes32"}],"name":"RelayedMessage","type":"event"},
        {"anonymous":false,"inputs":[{"indexed":true,"name":"msgHash","type":"bytes32"}],"name":"FailedRelayedMessage","type":"event"}
      ]
    confirmation: fast
    rules:
      - when: 'event.name == "FailedRelayedMessage"'
        severity: high
        receivers: [high]
